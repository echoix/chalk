name: build-envs
on:
  push:
    branches:
    - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: anthonyalmarza/alpine-pyenv:cable
    env:
      BASH_ENV: "~/.bashrc"
    steps:
    - uses: actions/checkout@v4
    - name: restore_cache
      if: false
      uses: actions/cache@v4
      with:
        key: chalk-{{ .Branch }}-{{ checksum "requirements-dev.txt" }}
        path: |-
          ./.tox
          ./venv
        restore-keys: chalk-{{ .Branch }}-{{ checksum "requirements-dev.txt" }}
    - name: Install dev requirements
      run: "./bin/install"
    - name: Run the tests
      run: "./bin/test"
  deploy:
    if: # GitHub does not currently support regular expressions inside if conditions
#         (github.ref == 'refs/tags//[0-9](\.[0-9]+)*/') && (github.ref != 'refs/heads//.*/')
    runs-on: ubuntu-latest
    container:
      image: anthonyalmarza/alpine-pyenv:cable
    needs:
    - test
    steps:
    - uses: actions/checkout@v4
    - name: restore_cache
      if: false
      uses: actions/cache@v4
      with:
        key: chalk-{{ .Branch }}-{{ checksum "requirements-dev.txt" }}
        path: UPDATE_ME
        restore-keys: chalk-{{ .Branch }}-{{ checksum "requirements-dev.txt" }}
    - name: Install dev requirements
      run: "./bin/install"
    - name: Deploy
      run: "./bin/deploy"
